name: B-field benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "2"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure optimized GCC build
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DENABLE_TESTING=ON -DENABLE_DEVELOPER_MODE=ON

      - name: Build benchmark
        run: cmake --build build --target bfield_solver_benchmark --parallel 2

      # Keep the benchmark's existing speedup threshold. Shared runner timing
      # varies, so this check is separate from automatic correctness CI.
      - name: Run benchmark
        run: ctest --test-dir build -L benchmark --verbose --no-tests=error --timeout 300
