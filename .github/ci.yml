name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  correctness:
    name: ${{ matrix.os }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # Linux is the validated release platform. Keep native Windows results
    # visible while existing source portability limitations remain documented.
    continue-on-error: ${{ matrix.os == 'windows-2022' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        build_type: [Debug, RelWithDebInfo]
    env:
      OMP_NUM_THREADS: "2"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure GCC
        if: runner.os == 'Linux'
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DENABLE_TESTING=ON -DENABLE_DEVELOPER_MODE=ON

      - name: Configure MSVC
        if: runner.os == 'Windows'
        run: >-
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DOpenMP_RUNTIME_MSVC=llvm
          -DENABLE_TESTING=ON -DENABLE_DEVELOPER_MODE=ON

      - name: Locate MSVC LLVM OpenMP runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $visualStudioPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $runtimeDirectories = Get-ChildItem "$visualStudioPath\VC\Redist\MSVC" -Recurse -Filter "libomp*.x86_64.dll" |
            Select-Object -ExpandProperty DirectoryName -Unique
          if (-not $runtimeDirectories) {
            throw "The MSVC LLVM OpenMP runtime was not found in the Visual Studio installation."
          }
          $runtimeDirectories | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel 2

      - name: Run correctness tests
        run: >-
          ctest --test-dir build --build-config ${{ matrix.build_type }}
          --output-on-failure --no-tests=error --timeout 300 --parallel 2
          -LE benchmark

      - name: Check publication exporter
        run: python test/publication_export.py

      - name: Validate Linux examples
        if: runner.os == 'Linux'
        run: >-
          python test/publication_examples.py --executable build/src/ionp/IONP
          --source-dir . --work-dir build/publication-example-check

      - name: Validate Windows examples
        if: runner.os == 'Windows'
        run: >-
          python test/publication_examples.py
          --executable build/src/ionp/${{ matrix.build_type }}/IONP.exe
          --source-dir . --work-dir build/publication-example-check
